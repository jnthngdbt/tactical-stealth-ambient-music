<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">

		<title>TSAM // OVERWATCH</title>

		<!-- CSS -->
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
		<link href="https://fonts.googleapis.com/css?family=Russo+One" rel="stylesheet">
		<link href="https://fonts.googleapis.com/css?family=Share+Tech+Mono" rel="stylesheet">
		<link rel="stylesheet" href="index.css">
		<link rel="stylesheet" href="css/overlay.css">

	</head>
	<body>

		<!-- 3D scene -->
		<script type="module" src="main.ts"></script>

		<!-- Tactical HUD overlay (display only, no interaction) -->
		<div id="hud">
			<div class="hud-vignette"></div>
			<div class="hud-scanlines"></div>

			<div class="hud-corner tl"></div>
			<div class="hud-corner tr"></div>
			<div class="hud-corner bl"></div>
			<div class="hud-corner br"></div>

			<header class="hud-header">
				<div class="hud-status hud-status-left">
					<!-- Doubles as the record button: click to start/stop, timecode only runs while recording -->
					<button class="hud-rec" id="hudRec" type="button" title="Click to record"><span class="hud-rec-dot"></span>REC <span id="hudTimecode">00:00:00</span></button>
					<div class="hud-callsign"><span class="hud-subtitle" id="hudMode">DRONE CAMERA FEED</span></div>
				</div>
				<div class="hud-status hud-status-right">
					<div class="hud-gps">GPS <span id="hudGpsStatus">LOCK</span></div>
					<div class="hud-signal">
						<span class="hud-signal-bars"><i></i><i></i><i></i><i></i></span>
						<span class="hud-battery" id="hudBattery">98%</span>
					</div>
				</div>
			</header>

			<div class="hud-bottom-left">
				<div class="hud-telemetry" id="hudTelemetry">
					<div class="hud-telem-item"><span class="hud-telem-label">ALT</span><span id="hudAlt">---</span>M</div>
					<div class="hud-telem-item"><span class="hud-telem-label">HDG</span><span id="hudHdg">---</span>&deg;</div>
					<div class="hud-telem-item"><span class="hud-telem-label">SPD</span><span id="hudSpd">-.-</span>M/S</div>
				</div>

				<div class="hud-coords-panel">
					<div class="hud-coords-label">SITE COORDS</div>
					<div class="hud-coords" id="hudCoords">--.-----, --.-----</div>
				</div>
			</div>

			<!-- Cinematic mode only: per-operator name + simulated biometrics, populated by main.ts -->
			<div class="hud-vitals-panel" id="hudVitalsPanel">
				<div class="hud-vitals-label">OPERATOR VITALS</div>
				<div class="hud-operators-panel" id="hudOperators"></div>
			</div>

			<!-- Path editor mode only (see pathEditor.ts): hidden/populated via JS -->
			<div class="hud-editor-panel" id="editorPanel" hidden>
				<div class="hud-editor-title">PATH EDITOR</div>
				<div class="hud-editor-operator" id="editorOperator"></div>
				<div class="hud-editor-count" id="editorCount"></div>
				<div class="hud-editor-count" id="editorBearing"></div>
				<div class="hud-hint">
					Click: add checkpoint · Right-click: remove checkpoint · Ctrl+drag: rotate · 1-9: select operator · O: toggle occlusion · T: toggle timestamps
				</div>
				<div class="hud-editor-buttons">
					<button id="editorSaveBtn" class="hud-editor-btn" type="button">Save</button>
					<button id="editorAddBtn" class="hud-editor-btn" type="button">Add</button>
					<button id="editorDeleteBtn" class="hud-editor-btn" type="button">Delete</button>
					<button id="editorCancelBtn" class="hud-editor-btn" type="button">Cancel</button>
				</div>
			</div>
		</div>

	</body>
</html>
