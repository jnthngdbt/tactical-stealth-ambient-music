<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">

		<title>TSAM // OBJECTIVE // MAIN</title>

		<!-- CSS -->
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
		<link href="https://fonts.googleapis.com/css?family=Russo+One" rel="stylesheet">
		<link href="https://fonts.googleapis.com/css?family=Share+Tech+Mono" rel="stylesheet">

		<script type="module" crossorigin src="../assets/objectives-Dw7nicOS.js"></script>
		<link rel="modulepreload" crossorigin href="../assets/three.module-DP9u_-zm.js">
		<link rel="modulepreload" crossorigin href="../assets/RenderPass-BhvcOfrW.js">
		<link rel="stylesheet" crossorigin href="../assets/objectives-1_qGlnZ4.css">
	</head>
	<body>

		<!-- 3D scene -->

		<!-- Tactical HUD overlay (display only, no interaction) -->
		<div id="hud">
			<div class="hud-vignette"></div>
			<div class="hud-scanlines"></div>

			<div class="hud-corner tl"></div>
			<div class="hud-corner tr"></div>
			<div class="hud-corner bl"></div>
			<div class="hud-corner br"></div>

			<header class="hud-header">
				<div class="hud-callsign">TSAM // GHOST-6</div>
				<h1 class="hud-title">OPERATION NIGHTGLASS</h1>
				<div class="hud-subtitle" id="hudSubtitle">FACILITY OVERVIEW</div>
			</header>

			<div class="hud-objective-panel" id="hudPanel">
				<div class="hud-objective-code" id="hudCode">OBJ-00</div>
				<div class="hud-objective-title" id="hudObjTitle">STANDBY</div>
				<div class="hud-objective-desc" id="hudDesc"></div>
				<div class="hud-progress-track"><div class="hud-progress-fill" id="hudProgress"></div></div>
			</div>

			<div class="hud-footer">
				<div class="hud-dots" id="hudDots"></div>
				<div class="hud-counter" id="hudCounter">00 / 05</div>
			</div>
		</div>

		<!-- Save the looping animation as a video -->
		<button id="recordBtn" class="util-button" title="Record one loop as video">
			<i class="fas fa-circle"></i>
		</button>

	</body>
</html>
